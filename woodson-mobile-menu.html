<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Shop Departments | Woodson Lumber</title>
  <base target="_top">
  <style>
    :root {
      --maroon: #6b0016;
      --maroon-dark: #4e0010;
      --yellow: #f4c400;
      --ink: #171717;
      --muted: #686868;
      --line: #dedede;
      --soft: #f5f5f5;
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: #fff; }
    body { min-width: 280px; min-height: 100dvh; margin: 0; background: #fff; color: var(--ink); }
    a { color: inherit; }
    button, input { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: max(14px, env(safe-area-inset-top)) 16px 14px;
      background: var(--maroon);
      color: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .2);
    }

    .topline { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .topline h1 { margin: 0; font-size: 22px; line-height: 1.15; }
    .topline a { flex: 0 0 auto; font-size: 12px; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
    .subtitle { margin: 4px 0 13px; color: #f1e7e9; font-size: 13px; }

    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translateY(-50%);
      fill: none;
      stroke: #666;
      stroke-width: 2;
      stroke-linecap: round;
    }
    #department-search {
      width: 100%;
      min-height: 48px;
      padding: 11px 42px;
      border: 2px solid transparent;
      border-radius: 7px;
      background: #fff;
      color: #111;
      font-size: 16px;
    }
    #department-search:focus { border-color: var(--yellow); outline: 0; }
    #clear-search {
      position: absolute;
      right: 5px;
      top: 50%;
      width: 38px;
      height: 38px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #555;
      font-size: 22px;
      cursor: pointer;
    }
    #clear-search:hover, #clear-search:focus-visible { background: var(--soft); color: var(--maroon); }

    main { width: min(760px, 100%); margin: 0 auto; padding: 14px 14px max(28px, env(safe-area-inset-bottom)); }
    .quick-links { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .quick-links a {
      min-height: 58px;
      padding: 9px 5px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
    }
    .quick-links a:hover, .quick-links a:focus-visible { border-color: var(--maroon); color: var(--maroon); background: #fff8fa; }

    .promos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .promos a {
      min-height: 44px;
      padding: 10px;
      border: 1px solid #d4aa00;
      border-radius: 7px;
      background: var(--yellow);
      color: #111;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
    }
    .promos a:hover, .promos a:focus-visible { background: #ddb400; }

    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 2px 9px; }
    .section-head h2 { margin: 0; color: var(--maroon); font-size: 19px; }
    .section-head span { color: var(--muted); font-size: 12px; }
    #status { margin: 18px 2px 8px; color: var(--muted); font-size: 13px; }

    #department-list { display: grid; gap: 8px; }
    .department {
      overflow: clip;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .department[open] { border-color: #c9aab1; box-shadow: 0 4px 16px rgba(61, 0, 13, .08); }
    .department summary {
      min-height: 52px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      list-style: none;
    }
    .department summary::-webkit-details-marker { display: none; }
    .department summary:hover, .department summary:focus-visible { background: #fff8fa; color: var(--maroon); }
    .department summary small { color: var(--muted); font-size: 11px; font-weight: 700; text-align: right; }
    .department[open] summary { border-bottom: 1px solid var(--line); color: var(--maroon); }
    .subcategories { display: grid; grid-template-columns: 1fr; padding: 6px; }
    .subcategories a {
      min-height: 44px;
      padding: 10px 9px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .subcategories a::after { content: "›"; color: var(--maroon); font-size: 20px; line-height: 1; }
    .subcategories a:hover, .subcategories a:focus-visible { background: var(--soft); color: var(--maroon); }
    .subcategories .shop-all { background: #f8eef0; color: var(--maroon); font-weight: 900; }

    #results { display: grid; gap: 7px; }
    .result {
      min-height: 52px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }
    .result:hover, .result:focus-visible { border-color: var(--maroon); color: var(--maroon); background: #fff8fa; }
    .result small { color: var(--muted); font-size: 11px; font-weight: 700; text-align: right; }
    .empty { padding: 24px 12px; border-radius: 8px; background: var(--soft); color: var(--muted); text-align: center; }

    .all-products {
      min-height: 48px;
      margin-top: 16px;
      border-radius: 7px;
      background: var(--maroon);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
    }
    .all-products:hover, .all-products:focus-visible { background: var(--maroon-dark); }

    [hidden] { display: none !important; }
    @media (min-width: 620px) {
      .subcategories { grid-template-columns: 1fr 1fr; gap: 2px; }
      #results { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topline">
      <h1>Shop departments</h1>
      <a href="https://www.woodsonlumber.com">Woodson home</a>
    </div>
    <p class="subtitle">Search every WebTrack department and subcategory.</p>
    <label class="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="department-search" type="search" placeholder="Search departments" aria-label="Search departments and subcategories" autocomplete="off">
      <button id="clear-search" type="button" aria-label="Clear search" hidden>&times;</button>
    </label>
  </header>

  <main>
    <nav class="quick-links" aria-label="Shopping shortcuts">
      <a href="https://webtrack.woodsonlumber.com/Default.aspx?portal=1">Account</a>
      <a href="https://www.woodsonlumber.com/stores">Locations</a>
      <a href="https://webtrack.woodsonlumber.com/ShoppingCart.aspx">Cart</a>
    </nav>

    <nav class="promos" aria-label="Featured departments">
      <a href="https://webtrack.woodsonlumber.com/Products.aspx?pl1=4518&amp;pg=4518&amp;sort=StockClassSort&amp;direction=asc">On Sale</a>
      <a href="https://webtrack.woodsonlumber.com/Products.aspx?pl1=4312&amp;pg=4312&amp;sort=StockClassSort&amp;direction=asc">Clearance</a>
    </nav>

    <p id="status" role="status" aria-live="polite">Loading departments…</p>

    <section id="browse" hidden>
      <div class="section-head"><h2>All departments</h2><span id="department-count"></span></div>
      <div id="department-list"></div>
    </section>

    <section id="search-results" hidden>
      <div class="section-head"><h2>Search results</h2><span id="result-count"></span></div>
      <div id="results"></div>
    </section>

    <a class="all-products" href="https://webtrack.woodsonlumber.com/Products.aspx">View all products</a>
  </main>

  <script>
    (function () {
      "use strict";

      var WEBTRACK = "https://webtrack.woodsonlumber.com";
      var FALLBACK = [
        ["Deals", 4546], ["Lawn & Garden", 18], ["Building Materials", 4402],
        ["Tools", 26], ["Hardware", 19], ["Outdoor Living & Patio", 2357],
        ["Lighting & Electrical", 16], ["Home Decor & Accents", 4322],
        ["Housewares", 2153], ["Storage & Organization", 4388], ["Plumbing", 24],
        ["Doors & Windows", 4415], ["Gifts & Accessories", 2727],
        ["Bolts, Screws, Nails", 1822], ["Farm & Ranch Supplies", 17],
        ["Clearance", 4312], ["Animals/Pets", 2683], ["Heating & Cooling", 2076],
        ["Paint & Caulking", 12], ["Automotive", 2270], ["Floors & Ceilings", 1842]
      ].map(function (item) {
        return {
          name: item[0],
          href: WEBTRACK + "/Products.aspx?pl1=" + item[1] + "&pg=" + item[1] + "&sort=StockClassSort&direction=asc",
          subcategories: []
        };
      });

      var search = document.getElementById("department-search");
      var clearSearch = document.getElementById("clear-search");
      var status = document.getElementById("status");
      var browse = document.getElementById("browse");
      var searchResults = document.getElementById("search-results");
      var departmentList = document.getElementById("department-list");
      var departmentCount = document.getElementById("department-count");
      var resultCount = document.getElementById("result-count");
      var results = document.getElementById("results");
      var departments = FALLBACK;
      var entries = [];

      function useful(department) {
        return department && department.name && !/^(store locations|miscellaneous)$/i.test(department.name) &&
          ((department.subcategories && department.subcategories.length) || /^(deals|clearance)$/i.test(department.name));
      }

      function safeHref(value) {
        try {
          var url = new URL(value, WEBTRACK);
          return url.origin === WEBTRACK ? url.href : WEBTRACK + "/Products.aspx";
        } catch (error) {
          return WEBTRACK + "/Products.aspx";
        }
      }

      function link(label, href, className, context) {
        var anchor = document.createElement("a");
        anchor.className = className || "";
        anchor.href = safeHref(href);
        var text = document.createElement("span");
        text.textContent = label;
        anchor.appendChild(text);
        if (context) {
          var small = document.createElement("small");
          small.textContent = context;
          anchor.appendChild(small);
        }
        return anchor;
      }

      function setDepartments(value) {
        departments = value.length ? value : FALLBACK;
        entries = [];
        departments.forEach(function (department) {
          entries.push({ name: department.name, href: department.href, context: "Department", department: true });
          (department.subcategories || []).forEach(function (subcategory) {
            entries.push({ name: subcategory.name, href: subcategory.href, context: department.name, department: false });
          });
        });
        renderBrowse();
        status.hidden = true;
        browse.hidden = false;
      }

      function renderBrowse() {
        departmentList.replaceChildren();
        departmentCount.textContent = departments.length + " departments";
        departments.forEach(function (department) {
          var details = document.createElement("details");
          details.className = "department";
          var summary = document.createElement("summary");
          var name = document.createElement("span");
          name.textContent = department.name;
          var count = document.createElement("small");
          count.textContent = department.subcategories && department.subcategories.length
            ? department.subcategories.length + " categories"
            : "Shop department";
          summary.append(name, count);
          var subcategories = document.createElement("div");
          subcategories.className = "subcategories";
          subcategories.appendChild(link("Shop all " + department.name, department.href, "shop-all"));
          (department.subcategories || []).forEach(function (subcategory) {
            subcategories.appendChild(link(subcategory.name, subcategory.href));
          });
          details.append(summary, subcategories);
          departmentList.appendChild(details);
        });
      }

      function renderSearch(value) {
        var query = String(value || "").trim().toLowerCase();
        clearSearch.hidden = !query;
        if (!query) {
          searchResults.hidden = true;
          browse.hidden = false;
          return;
        }

        var tokens = query.split(/\s+/);
        var matches = entries.filter(function (entry) {
          var haystack = (entry.name + " " + entry.context).toLowerCase();
          return tokens.every(function (token) { return haystack.indexOf(token) !== -1; });
        }).sort(function (a, b) {
          var aStarts = a.name.toLowerCase().indexOf(query) === 0 ? 0 : 1;
          var bStarts = b.name.toLowerCase().indexOf(query) === 0 ? 0 : 1;
          if (aStarts !== bStarts) return aStarts - bStarts;
          if (a.department !== b.department) return a.department ? -1 : 1;
          return a.name.localeCompare(b.name);
        });

        browse.hidden = true;
        searchResults.hidden = false;
        results.replaceChildren();
        resultCount.textContent = matches.length + (matches.length === 1 ? " result" : " results");
        if (!matches.length) {
          var empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No matching departments or subcategories.";
          results.appendChild(empty);
          return;
        }
        matches.slice(0, 100).forEach(function (entry) {
          results.appendChild(link(entry.name, entry.href, "result", entry.context));
        });
      }

      search.addEventListener("input", function () { renderSearch(search.value); });
      clearSearch.addEventListener("click", function () {
        search.value = "";
        renderSearch("");
        search.focus();
      });

      fetch("webtrack-departments.json", { credentials: "omit" })
        .then(function (response) {
          if (!response.ok) throw new Error("Department request failed");
          return response.json();
        })
        .then(function (payload) {
          if (!payload || !Array.isArray(payload.departments)) throw new Error("Invalid department data");
          setDepartments(payload.departments.filter(useful));
        })
        .catch(function () {
          status.textContent = "Live subcategories were unavailable. Showing the main departments.";
          setDepartments(FALLBACK);
          status.hidden = false;
        });
    }());
  </script>
</body>
</html>
