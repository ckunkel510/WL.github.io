openapi: 3.0.3
info:
  title: Woodson Customer-Safe Product and Shipping Tools
  version: 12.0.2
  description: Search the current Woodson Lumber & Hardware online catalog, browse verified WebTrack product groups, and check UPS shipping for one exact product. This API exposes customer-facing data only and never exposes cost, margin, markup, profit, supplier, vendor, package dimensions, or advertising-economics data.

servers:
  - url: https://wl-upsrates.vercel.app

paths:
  /api/ai-product-search:
    post:
      operationId: searchProducts
      summary: Search Woodson's current customer-safe product catalog
      description: >
        Use this tool before answering any product question, product-like phrase,
        or request to browse a product group or department, except a shipping or
        rate question that already includes an exact product code or SKU, quantity,
        and destination ZIP. For that complete shipping request, call
        checkProductShipping directly and do not call searchProducts first.
        Send a POST JSON body with the customer's exact product phrase in the query field.
        Never call this tool with an empty query.

        For follow-up product messages, include relevant prior product context in the query.
        When a visitor explicitly asks to open, view, or go to one previously returned
        product, set action=view_product and copy that result's productCode exactly into
        productCode. When a visitor explicitly asks to add, put, buy, or purchase one
        previously returned product, set action=add_to_cart and copy that result's
        productCode exactly into productCode. Never guess or alter a productCode.
        Never use an action when multiple products remain possible.
        A new named product or item number always replaces earlier product context.
        Treat pronouns such as "it", "that", or "this one" as referring to the most
        recently returned single product only. Never reuse an earlier product when
        the visitor names a different product in the same add-to-cart request.

        If the visitor asks to place, submit, complete, or check out an order, do not
        call this tool for an action and do not claim to place the order. Tell them
        they will be taken to their cart to review checkout and submit the order themselves.

        actionReady means only that one verified product is safe for a browser action.
        It never proves that WebTrack changed the cart. For add_to_cart, tell the visitor
        to look for the Woodson cart confirmation on the page. Never say an item was added
        unless that on-page confirmation appears.

        If hasResults=true, reply using the answer field exactly. Do not add unreturned
        products, specifications, prices, availability claims, or assumptions.
        Prefer the one best verified product. The API returns up to three choices only
        when the request is genuinely ambiguous, ordered with the closest match first.
        Preserve every product-image link, product-details link, and verified product-group
        link in the answer exactly as returned.
        If hasResults=false for an ordinary product or cart request, reply using the
        answer field exactly and ask one concise clarifying question. Do not transfer
        the chat merely because a product was not found, an add-to-cart attempt needs
        clarification, or WebTrack did not confirm the cart change.
        Invoke the configured human handoff only when sensitiveRequest=true, the visitor
        explicitly requests a person, or a repeated technical failure still prevents help.

        Never ask this tool for internal cost, average cost, margin, markup, profit,
        supplier pricing, vendor terms, or advertising economics. Those fields do not
        exist in this customer-safe catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  maxLength: 240
                  description: REQUIRED. The visitor's exact product request or identifier, with relevant prior product context for follow-ups.
                action:
                  type: string
                  enum:
                    - search
                    - view_product
                    - add_to_cart
                  default: search
                  description: Use view_product or add_to_cart only after the visitor explicitly requests that action for one previously returned exact product.
                productCode:
                  type: string
                  maxLength: 80
                  description: For view_product or add_to_cart, copy the exact productCode from the one previously returned result. Never infer or alter it.
            examples:
              cordlessDrill:
                summary: Brand-qualified product request
                value:
                  query: Milwaukee cordless drill
              fasciaFollowUp:
                summary: Product follow-up with context
                value:
                  query: 1/2 inch by 6 inch by 16 foot fascia LP SmartSide
              productCode:
                summary: Exact product code
                value:
                  query: 2462-22
      responses:
        "200":
          description: Customer-safe product search response. Use answer exactly.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - hasResults
                  - matchType
                  - answer
                  - results
                properties:
                  success:
                    type: boolean
                  hasResults:
                    type: boolean
                  matchType:
                    type: string
                    enum:
                      - exact
                      - close
                      - group
                      - none
                  resultType:
                    type: string
                    enum:
                      - groups
                  query:
                    type: string
                  sensitiveRequest:
                    type: boolean
                    description: True when the request asks for protected internal economics. Use answer and hand off to a human.
                  requestedAction:
                    type: string
                    enum:
                      - view_product
                      - add_to_cart
                  actionReady:
                    type: boolean
                    description: True only when one exact verified product is safe for the requested browser or cart action. It does not confirm that WebTrack changed the cart.
                  actionStatus:
                    type: string
                    enum:
                      - browser_confirmation_required
                      - browser_navigation_requested
                    description: For add_to_cart, browser_confirmation_required means the visitor must see the Woodson on-page confirmation before the AI may describe the cart action as successful.
                  answer:
                    type: string
                    description: Customer-ready response. Use this exactly whether hasResults is true or false.
                  results:
                    type: array
                    maxItems: 3
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        rank:
                          type: integer
                        productId:
                          type: string
                        productCode:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        brand:
                          type: string
                        price:
                          type: string
                        salePrice:
                          type: string
                        availability:
                          type: string
                        productUrl:
                          type: string
                        imageUrl:
                          type: string
                        category:
                          type: string
                        gtin:
                          type: string
                        mpn:
                          type: string
                        groupName:
                          type: string
                        parentGroup:
                          type: string
                        groupUrl:
                          type: string

  /api/ai-shipping-check:
    post:
      operationId: checkProductShipping
      summary: Check UPS shipping for one exact Woodson product and destination ZIP
      description: >
        Use this tool when a visitor asks whether one exact Woodson product can ship
        by UPS or asks for its UPS shipping rate. If the visitor supplies an exact
        product code or SKU, call this operation directly with that code; do not call
        searchProducts first and do not ask permission to perform the check. If the
        visitor supplies only a name or description, first resolve one exact product
        with searchProducts, then copy its productCode and productId exactly. Never
        guess or alter either identifier.

        Ask only for the quantity and destination ZIP code when they are missing.
        Never request a full street address, phone number, email address, payment
        information, or other contact details for this check. The server always uses
        Woodson's Caldwell store, ZIP 77836, as the default ship-from origin and uses
        the same trusted product-package and UPS rating logic as checkout.

        Reply with the answer field exactly. eligible=true means UPS returned a
        customer rate for that exact product, quantity, and ZIP. status=needs_review
        does not prove the product cannot ship; it means a Woodson team member must
        verify its shipping configuration or arrange delivery/freight.
        status=not_eligible means UPS small-package service is unavailable for the
        checked item, quantity, and ZIP, but Woodson delivery or freight may still
        be possible. If
        status=temporarily_unavailable, say only that the check could not be completed
        and never describe the item as unshippable. Never reveal or infer package
        dimensions, weights, cost, margin, markup, profit, supplier information, UPS
        credentials, shipping-policy economics, or other internal configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - productCode
                - quantity
                - destinationPostalCode
              properties:
                productCode:
                  type: string
                  maxLength: 80
                  description: Use the exact product code or SKU supplied by the visitor, or copy the exact productCode returned for the one selected product by searchProducts.
                productId:
                  type: string
                  maxLength: 40
                  description: Copy the exact productId returned by searchProducts when it is available.
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 25
                  description: Exact quantity the visitor wants to ship.
                destinationPostalCode:
                  type: string
                  pattern: '^\d{5}(?:-\d{4})?$'
                  description: Customer-provided US destination ZIP code. Do not request a street address.
            examples:
              oneItem:
                summary: Check one exact product to a US ZIP
                value:
                  productCode: 2904-22
                  productId: "221283"
                  quantity: 1
                  destinationPostalCode: "43215"
      responses:
        "200":
          description: Customer-safe UPS eligibility or temporary-status response. Use answer exactly.
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - eligible
                  - status
                  - productCode
                  - quantity
                  - destinationPostalCode
                  - origin
                  - answer
                properties:
                  success:
                    type: boolean
                  eligible:
                    type: boolean
                    nullable: true
                    description: True only when a current UPS rate was returned; null when the service could not determine eligibility.
                  status:
                    type: string
                    enum:
                      - eligible
                      - not_eligible
                      - needs_review
                      - temporarily_unavailable
                  productId:
                    type: string
                  productCode:
                    type: string
                  quantity:
                    type: integer
                  destinationPostalCode:
                    type: string
                  origin:
                    type: object
                    additionalProperties: false
                    properties:
                      name:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      postalCode:
                        type: string
                      country:
                        type: string
                  reasonCodes:
                    type: array
                    items:
                      type: string
                  lowestRate:
                    $ref: '#/components/schemas/PublicShippingRate'
                  rates:
                    type: array
                    maxItems: 8
                    items:
                      $ref: '#/components/schemas/PublicShippingRate'
                  quoteExpiresAt:
                    type: string
                  answer:
                    type: string
                    description: Customer-ready response. Use this exactly and do not add shipping assumptions.
        "400":
          description: The exact product, quantity, or destination ZIP is missing or invalid.
        "429":
          description: Too many shipping checks were requested in a short period.

components:
  schemas:
    PublicShippingRate:
      type: object
      additionalProperties: false
      properties:
        serviceCode:
          type: string
        serviceName:
          type: string
        amount:
          type: number
        currency:
          type: string
